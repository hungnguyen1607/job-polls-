<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companies</title>
<style>
  :root { --muted: #6b7280; --line: #eee; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #111; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  #sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  nav { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  nav a { color: var(--muted); margin-right: 14px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .tab { border: 1px solid #ddd; background: #fff; padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; }
  .tab.on { background: #111; color: #fff; border-color: #111; }
  input[type=search] { flex: 1; min-width: 200px; border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; font: inherit; outline: none; }
  input[type=search]:focus { border-color: #111; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 6px 8px 6px 0; border-bottom: 1px solid #ddd; cursor: pointer; user-select: none; white-space: nowrap; }
  td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.m { color: var(--muted); font-size: 13px; }
  td a { color: #111; }
  td.people a { color: var(--muted); font-size: 13px; margin-right: 12px; white-space: nowrap; }
  td.people a.rec { color: #111; font-weight: 500; }
  td.people a:hover { color: #111; }
  td.n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.v { font-size: 12px; white-space: nowrap; }
  td.v .ok { color: #047857; } td.v .no { color: #b91c1c; }
  .applied { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; }
</style>
</head>
<body>
<main>
  <h1>Companies</h1>
  <div id="sub">Loading…</div>
  <nav><a href="/">← Internships</a><a href="/tailor">Tailor resume</a><a href="/tracker">Application tracker</a></nav>
  <div class="bar">
    <button class="tab on" data-region="canada">Canada</button>
    <button class="tab" data-region="us">US</button>
    <button class="tab" data-region="big5">Big 5</button>
    <input id="q" type="search" placeholder="Search companies…" autofocus>
  </div>
  <table>
    <thead>
      <tr>
        <th data-k="company">Company</th>
        <th data-k="where">Where</th>
        <th data-k="last_term">Last intern</th>
        <th data-k="intern_count">Interns</th>
        <th data-k="open_now">Open</th>
        <th data-k="visa">Visa</th>
        <th data-k="ca_intern_flag">CA interns</th>
        <th>People</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function companySlug(url) {
    const m = String(url || "").match(/linkedin\.com\/company\/([^/?#]+)/i);
    return m ? decodeURIComponent(m[1].replace(/\/+$/, "")) : "";
  }

  function liSearch(path, keywords) {
    return `https://www.linkedin.com/search/results/${path}/?keywords=${encodeURIComponent(keywords)}`;
  }

  function peopleLinks(r) {
    const name = r.company;
    const slug = companySlug(r.linkedin);
    const recQ = "university recruiter OR campus recruiter OR early talent OR early careers";
    const engQ = "software engineer OR software developer";
    const rec = slug
      ? `https://www.linkedin.com/company/${encodeURIComponent(slug)}/people/?keywords=${encodeURIComponent(recQ)}`
      : liSearch("people", `"${name}" ("university recruiter" OR "campus recruiter" OR "early talent" OR "early careers")`);
    const eng = slug
      ? `https://www.linkedin.com/company/${encodeURIComponent(slug)}/people/?keywords=${encodeURIComponent(engQ)}`
      : liSearch("people", `"${name}" ("software engineer" OR "software developer")`);
    return { rec, eng };
  }

  const REFRESH_MS = 10_000;
  let canada = [], us = [], big5 = [];
  let region = "canada", sortKey = "last_term", sortDir = 1;

  function rowsFor() {
    if (region === "us") return us;
    if (region === "big5") return big5;
    return canada;
  }

  const TERM_ORDER = ["Winter 2027", "Spring 2027", "Summer 2027", "Fall 2027", "Fall 2026", "Summer 2026",
                      "Spring 2026", "Winter 2026", "Fall 2025", "Summer 2025", "Winter 2025"];
  function lastTerm(r) {
    const terms = String(r.term || "").split(/\s*,\s*/).filter(Boolean);
    const known = terms.filter((t) => TERM_ORDER.includes(t)).sort((a, b) => TERM_ORDER.indexOf(a) - TERM_ORDER.indexOf(b));
    if (known.length) return known[0];
    if (r.open_now === "yes" || terms.includes("Open")) return "open now";
    if (r.last_intern_month) return `posted ${monthLabel(r.last_intern_month)}`;
    return "never seen";
  }
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const monthLabel = (ym) => { const [y, m] = String(ym).split("-"); return `${MONTHS[Number(m) - 1] || ""} ${y}`.trim(); };
  const termRank = (r) => {
    const t = lastTerm(r);
    if (TERM_ORDER.includes(t)) return TERM_ORDER.indexOf(t);
    if (t === "open now") return 100;
    if (r.last_intern_month) return 200 + (300000 - Number(String(r.last_intern_month).replace("-", ""))) / 1000;
    return 9999;
  };

  function val(r, k) {
    if (k === "intern_count") return Number(r[k]) || 0;
    if (k === "last_term") return termRank(r);
    if (k === "open_now") return r.open_now === "yes" ? 0 : 1;
    if (k === "visa") return r.visa === "sponsor" ? 0 : 1;
    if (k === "ca_intern_flag") return r.ca_intern_flag === "yes" ? 0 : 1;
    return String(r[k] || "");
  }

  function render() {
    const q = $("#q").value.trim().toLowerCase();
    const all = rowsFor();
    let shown = all.filter((r) => {
      if (!q) return true;
      const blob = `${r.company || ""} ${r.example_job || ""} ${r.term || ""} ${r.where || ""}`.toLowerCase();
      return blob.includes(q);
    });
    shown = shown.slice().sort((a, b) => {
      const av = val(a, sortKey), bv = val(b, sortKey);
      const primary = typeof av === "number" ? (av - bv) * sortDir : av.localeCompare(bv) * sortDir;
      return primary || String(a.company || "").localeCompare(String(b.company || ""));
    });
    $("#rows").innerHTML = shown.map((r) => {
      const p = peopleLinks(r);
      const applied = r.applied === "yes" ? `<span class="applied">applied</span>` : "";
      const job = r.example_link
        ? `<a class="rec" href="${esc(r.example_link)}" target="_blank" rel="noopener">Job</a>`
        : r.careers_page ? `<a class="rec" href="${esc(r.careers_page)}" target="_blank" rel="noopener">Site</a>` : "";
      const visa = region === "us"
        ? (r.visa === "sponsor" ? `<span class="ok">sponsor</span>` : `<span class="no">no-sponsor</span>`)
        : "";
      const ca = region === "us" && r.ca_intern_flag === "yes" ? `<span class="ok">yes</span>` : "";
      return `<tr>
        <td><a href="${esc(p.rec)}" target="_blank" rel="noopener">${esc(r.company)}</a>${applied}</td>
        <td class="m">${esc(r.where || "")}</td>
        <td class="n" title="${esc(r.last_intern_title || "")}">${esc(lastTerm(r))}${r.open_now === "yes" && lastTerm(r) !== "open now" ? " · open" : ""}</td>
        <td class="n">${r.intern_count || ""}</td>
        <td class="n">${r.open_now === "yes" ? "open" : ""}</td>
        <td class="v">${visa}</td>
        <td class="v">${ca}</td>
        <td class="people">
          <a class="rec" href="${esc(p.rec)}" target="_blank" rel="noopener">Recruiters</a>
          <a href="${esc(p.eng)}" target="_blank" rel="noopener">Engineers</a>
          ${job}
        </td>
      </tr>`;
    }).join("") || `<tr><td class="m" colspan="8">No companies</td></tr>`;
    const n = all.length;
    const label = region === "us" ? "US intern employers"
      : region === "big5" ? "companies hiring through the Big 5"
      : "companies with a Canadian office";
    $("#sub").textContent = q ? `${shown.length} of ${n} ${label}` : `${n} ${label}.`;
  }

  async function load() {
    try {
      const res = await fetch("/api/outreach", { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.canada?.rows?.length) canada = data.canada.rows;
      if (data.us?.rows?.length) us = data.us.rows;
      if (data.big5?.rows?.length) big5 = data.big5.rows;
      render();
    } catch (e) {
      // Keep the last good lists; a rebuild can take ~10 s and reset the request.
      if (!canada.length && !us.length && !big5.length) {
        $("#sub").textContent = "Loading… (server busy, retrying)";
      }
    }
  }

  document.querySelectorAll("[data-region]").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll("[data-region]").forEach((t) => t.classList.toggle("on", t === b));
    region = b.dataset.region;
    render();
    $("#q").focus();
  }));
  $("#q").addEventListener("input", render);
  document.querySelector("table").addEventListener("click", (e) => {
    const k = e.target.dataset.k;
    if (!k) return;
    sortDir = k === sortKey ? -sortDir : (["company", "where", "last_term", "open_now", "visa", "ca_intern_flag"].includes(k) ? 1 : -1);
    sortKey = k;
    render();
  });

  load();
  setInterval(load, REFRESH_MS);
</script>
</body>
</html>
